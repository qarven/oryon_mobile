name: oryon_mobile
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter
  # Flutter's built-in localization and internationalization support
  flutter_localizations:
    sdk: flutter
  # Provides the CupertinoIcons font used by the Flutter SDK's Cupertino widgets
  cupertino_icons: 2.0.0
  # ConnectRPC client for communicating with backend services
  connectrpc: 2.0.0
  # Generated Dart Protobuf models and service definitions
  sdk_protobuf_gen_dart:
    path: protobuf/gen/dart
  # Generate and manage unique identifiers (UUIDs)
  uuid: 4.6.0
  # State management using the BLoC pattern
  flutter_bloc: 9.1.1
  # Immutable data classes and union types
  freezed_annotation: 3.1.0
  # JSON serialization and deserialization annotations
  json_annotation: 4.12.0
  # Service locator for dependency injection
  get_it: 9.3.0
  # Declarative routing and navigation between screens
  go_router: 18.1.0
  # Secure storage for sensitive data such as tokens and credentials
  flutter_secure_storage: 11.2.0
  # Schedule and display local notifications
  flutter_local_notifications: 22.3.2
  # Cache and manage files downloaded from the internet
  flutter_cache_manager: 3.4.5
  # Store simple key-value data locally, such as user preferences and settings
  shared_preferences: 2.5.6
  flutter_svg: 2.3.0

dependency_overrides:
  protobuf: 6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.2
  build: 4.0.11
  json_serializable: 6.14.1
  freezed: 4.0.2
  # Lints bloc/cubit code, run via `make lint`
  bloc_tools: 0.1.0-dev.25
  # Generates the native launch screen resources from flutter_native_splash.yaml
  flutter_native_splash: 2.4.8
  # Generates the launcher/app icons from flutter_launcher_icons.yaml
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  # Generates the localizations in lib/l10n from the .arb files (see l10n.yaml).
  generate: true
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  assets:
    - assets/logo/primary.png
    - assets/logo/white.png
    - assets/svgs/page_not_found.svg
    - assets/icons/bubble_chat_icon.png
    - assets/images/onboard1.png
    - assets/images/onboard2.png
    - assets/images/onboard3.png
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section.
  # example:
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/geist_mono/static/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist_mono/static/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist_mono/static/GeistMono-Bold.ttf
          weight: 700
