name: oryon_mobile
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  # Dart SDK version constraint
  sdk: ^3.13.7

dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter

  # Flutter localization and internationalization support
  flutter_localizations:
    sdk: flutter

  # Cupertino-style icons for iOS-inspired widgets
  cupertino_icons: 2.0.0

  # ConnectRPC client for communicating with backend services
  connectrpc: 2.0.1

  # Generated Dart Protobuf models and service definitions
  sdk_protobuf_gen_dart:
    path: protobuf/gen/dart

  # Generate universally unique identifiers (UUIDs)
  uuid: 4.6.0

  # State management using the BLoC and Cubit patterns
  flutter_bloc: 9.1.1

  # Annotations for generating immutable data classes and union types
  freezed_annotation: 3.1.0

  # Annotations for JSON serialization and deserialization
  json_annotation: 4.12.0

  # Service locator for dependency injection
  get_it: 9.3.0

  # Declarative routing and navigation between screens
  go_router: 18.1.1

  # Secure storage for sensitive data, tokens, and credentials
  flutter_secure_storage: 11.2.0

  # Schedule and display local notifications
  flutter_local_notifications: 22.3.2

  # Download, cache, and manage files from the internet
  flutter_cache_manager: 3.4.5

  # Persist simple key-value data such as user preferences
  shared_preferences: 2.5.6

  # Render SVG vector graphics in Flutter widgets
  flutter_svg: 2.3.0

  # Open URLs, websites, email clients, and other external applications
  url_launcher: 6.3.3

dependency_overrides:
  # Override the transitive protobuf dependency with a specific version
  protobuf: 6.1.0

dev_dependencies:
  # Flutter testing framework and test utilities
  flutter_test:
    sdk: flutter

  # Recommended Flutter and Dart static analysis rules
  flutter_lints: 6.0.0

  # Generate code using builders such as Freezed and JSON Serializable
  build_runner: 2.17.1

  # Core APIs for creating Dart code generators
  build: 5.0.0

  # Generate JSON serialization and deserialization code
  json_serializable: 6.15.2

  # Generate immutable classes, unions, and pattern matching
  freezed: 4.0.3

  # Lint and validate BLoC/Cubit code
  bloc_tools: 0.1.0-dev.25

  # Generate native launch screen resources from flutter_native_splash.yaml
  flutter_native_splash: 2.4.8

  # Generate launcher icons for Android and iOS
  flutter_launcher_icons: 0.14.4

flutter:
  # Enable Material Design icons and widgets
  uses-material-design: true

  # Generate localization code from ARB files using l10n.yaml
  generate: true

  # Application image, icon, and SVG assets
  assets:
    - assets/logo/primary.png
    - assets/logo/white.png
    - assets/svgs/page_not_found.svg
    - assets/icons/bubble_chat_icon.png
    - assets/images/onboard1.png
    - assets/images/onboard2.png
    - assets/images/onboard3.png

  # Custom font families and their supported weights
  fonts:
    # Poppins font family for application UI text
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700

    # Geist Mono font family for monospaced text
    - family: GeistMono
      fonts:
        - asset: assets/fonts/geist_mono/static/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist_mono/static/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist_mono/static/GeistMono-Bold.ttf
          weight: 700
