assert_lefthook_installed: true
min_version: 2.2.2

pre-commit:
  # Executes the commands sequentially in their configured order.
  # If a command fails, subsequent commands are skipped.
  piped: true
  commands:
    format:
      priority: 1
      glob: "lib/**/*.dart"
      run: dart format {staged_files}
      stage_fixed: true

    fix:
      priority: 2
      glob: "lib/**/*.dart"
      run: dart fix --apply
      stage_fixed: true

    lint:
      priority: 3
      glob: "lib/**/*.dart"
      run: flutter analyze

    bloc-lint:
      priority: 4
      glob: "lib/**/*.dart"
      run: dart run bloc_tools:bloc lint .

pre-push:
  commands:
    test:
      glob: "lib/**/*.dart"
      run: flutter test
