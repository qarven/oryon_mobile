# Launcher and app icons. Regenerate after editing with
# `dart run flutter_launcher_icons`.
#
# Note: `ic_launcher_round.xml` is not generated by the package and is kept by
# hand in `android/app/src/main/res/mipmap-anydpi-v26/`. Re-sync it with
# `ic_launcher.xml` if the adaptive icon config below changes.
flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 24
  # Opaque icon used for the legacy Android mipmaps and the iOS AppIcon set.
  image_path_android: assets/logo/launcher.png
  image_path_ios: assets/logo/launcher.png
  # The adaptive foreground keeps the logo inside the inner 72dp of the 108dp
  # canvas, otherwise the launcher mask crops it exactly like the splash did.
  # It is already padded, so the tool's default 16% inset would shrink it twice.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_background: "#C96442"
  adaptive_icon_foreground: assets/logo/logo_white_1152.png
  remove_alpha_ios: true